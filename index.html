<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies — Damon Downing</title>
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#0f172a; --muted:#475569; --card:#fff; --border:#e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --fg:#e2e8f0; --muted:#94a3b8; --card:#141b2d; --border:#1e293b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 24px; margin-bottom: 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  li a {
    display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; color: var(--fg); text-decoration: none; font-weight: 500;
  }
  li a:hover { border-color: #f59e0b; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Privacy Policies</h1>
  <ul>
    <li><a href="flick-football/">Flick Football <span class="muted">— Android</span></a></li>
    <li><a href="sleep-noise/">Sleep Noise <span class="muted">— iOS &amp; Android</span></a></li>
  </ul>
</div>
</body>
</html>
